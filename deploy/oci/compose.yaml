# Oracle Always Free A1 backend. Place app.env and origin.env beside this file
# on the VM; both are created by prepare-env.sh and must remain untracked.
# Work inference is cloud-only: no local model server, GPU, or model download is
# part of this stack. The app reads OPENROUTER_API_KEY from app.env.
name: coderax-oci

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: coderax:oci-always-free
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3080"
      SCHEDULES_SINGLE_PROCESS: "true"
      TRUST_PROXY: "1"
      # DOMAIN_CLIENT and DOMAIN_SERVER come from app.env so the Cloudflare
      # cutover does not require editing tracked Compose configuration.
      SESSION_COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      ENABLE_GUEST_ACCESS: "true"
      REGISTER_WINDOW: "60"
      REGISTER_MAX: "5"
      NO_INDEX: "true"
      CONFIG_PATH: /app/deploy/oci/coderax.yaml
      MEILI_HOST: ""
    volumes:
      - ./coderax.oci.yaml:/app/deploy/oci/coderax.yaml:ro
      - coderax-data:/app/data
      - uploads:/app/uploads
      - images:/app/client/public/images
      - logs:/app/logs
      - skills:/app/skill
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 24
      start_period: 180s
    networks:
      - internet

  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ./origin.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internet

networks:
  internet: {}

volumes:
  coderax-data: {}
  uploads: {}
  images: {}
  logs: {}
  skills: {}
  caddy-data: {}
  caddy-config: {}
