# Oracle Always Free A1 backend. Place app.env, origin.env and engine.env beside
# this file on the VM; they are created by prepare-env.sh and must remain
# untracked. Work inference is cloud-only: no local model server, GPU, or model
# download is part of this stack. OpenCode is a separate, authenticated service
# on the private `engine` network; it has no published port and Caddy is not on
# that network.
name: coderax-oci

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: coderax:oci-always-free
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3080"
      SCHEDULES_SINGLE_PROCESS: "true"
      TRUST_PROXY: "1"
      DOMAIN_CLIENT: ${CODERAX_PUBLIC_ORIGIN:-https://coderax.nnabdelshahid.workers.dev}
      DOMAIN_SERVER: ${CODERAX_PUBLIC_ORIGIN:-https://coderax.nnabdelshahid.workers.dev}
      SESSION_COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      # Owner-only runtime: password login is the only entry path. The legacy
      # Vercel frontend keeps working because it shares this backend until the
      # owner authorizes retirement; no guest path exists on either origin.
      ENABLE_GUEST_ACCESS: "false"
      REGISTER_WINDOW: "60"
      REGISTER_MAX: "5"
      NO_INDEX: "true"
      CONFIG_PATH: /app/deploy/oci/coderax.yaml
      MEILI_HOST: ""
    volumes:
      - ./coderax.oci.yaml:/app/deploy/oci/coderax.yaml:ro
      - coderax-data:/app/data
      - uploads:/app/uploads
      - images:/app/client/public/images
      - logs:/app/logs
      - skills:/app/skill
      # The engine mounts only the cloud workspace. The private root is on an
      # app-only volume the engine container cannot see.
      - engine-workspace:/srv/engine
      - engine-private:/srv/coderax/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 24
      start_period: 180s
    networks:
      - internet
      - engine

  opencode:
    profiles: [opencode]
    build:
      context: ./opencode
      dockerfile: Dockerfile
    image: coderax-opencode:oci-always-free
    restart: unless-stopped
    env_file:
      - ./engine.env
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "1.0"
    pids_limit: 256
    volumes:
      - engine-workspace:/srv/engine
      - engine-data:/data
    networks:
      - engine

  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ./origin.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internet

networks:
  internet: {}
  # Private service network. It is not `internal` because OpenCode needs
  # outbound HTTPS to the hosted provider; Caddy is not attached, so there is no
  # inbound path from the Internet.
  engine: {}

volumes:
  coderax-data: {}
  uploads: {}
  images: {}
  logs: {}
  skills: {}
  caddy-data: {}
  caddy-config: {}
  engine-workspace: {}
  engine-private: {}
  engine-data: {}
