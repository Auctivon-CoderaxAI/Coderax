# API-only configuration for the Oracle Always Free A1 backend.
# Ollama is reachable only on the private Docker model network.
version: 1.3.17
cache: true
# The native Work catalog adds the verified $0 OpenRouter models only when the
# server environment provides OPENROUTER_API_KEY. Without it, Work offers only
# the local Ollama models below.
freeInference:
  enabled: true
# Every new chat starts on the hosted $0 model pinned below. FreeOpenRouter is
# declared explicitly so the spec resolves even before a credential is present:
# a missing key then fails the turn visibly instead of letting the deployment
# fall back to the CPU-bound local Qwen models.
interface:
  # Keep the endpoint picker available so the Ollama fallback stays a deliberate
  # choice rather than the default.
  modelSelect: true
modelSpecs:
  list:
    - name: free-openrouter
      label: OpenRouter (free)
      description: Hosted $0 inference; no local GPU.
      default: true
      preset:
        endpoint: FreeOpenRouter
        model: nvidia/nemotron-3-ultra-550b-a55b:free
# Owner-only Work execution. OpenCode attaches to the `opencode` Compose
# service, and the model below is the only zero-cost path this VM can answer:
# local Ollama weights. Hosted OpenCode free ids need an OpenCode account, and
# the zero-cost guard refuses every provider outside `opencode` and the local
# runtimes. See the README's "Work engine" section before changing a value.
engines:
  defaultEngine: opencode
  workChat:
    enabled: true
    engine: opencode
    mode: private
  workspaces:
    privateRoot: /app/data/engine/private
    cloudRoot: /app/data/engine/cloud
  opencode:
    enabled: true
    baseURL: http://opencode:4096
    model: ollama/qwen3.5:9b
endpoints:
  custom:
    - name: Ollama
      apiKey: internal-ollama-placeholder
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - qwen3.5:9b
          - qwen3.5:4b
        fetch: false
      titleConvo: true
      titleModel: current_model
      summarize: false
      modelDisplayLabel: Ollama
    # Keep this entry identical to what the free-inference catalog injects
    # (name, baseURL, credential reference, and only verified :free models), or
    # the catalog treats the reserved name as a conflict and blocks the models.
    - name: FreeOpenRouter
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - nvidia/nemotron-3-ultra-550b-a55b:free
          - nvidia/nemotron-3.5-lightning:free
          - google/gemma-4-31b-it:free
        fetch: false
      titleConvo: false
      modelDisplayLabel: OpenRouter (free)
