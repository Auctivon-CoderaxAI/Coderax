# This configuration is mounted at /app/coderax.yaml by compose.yaml.
# Local inference comes from Ollama on the REMOTE server's private Docker network.
# Ollama ignores the required nonsecret compatibility apiKey placeholder.
version: 1.3.17
cache: true
# Verified zero-cost OpenRouter models join the Work catalog when the server
# environment provides an OpenRouter API key. Without that key this is a no-op
# and Work offers only the local Ollama models.
freeInference:
  enabled: true
endpoints:
  custom:
    - name: Ollama
      apiKey: internal-ollama-placeholder
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - qwen3.5:4b
        fetch: false
      titleConvo: true
      titleModel: current_model
      summarize: false
      modelDisplayLabel: Ollama
