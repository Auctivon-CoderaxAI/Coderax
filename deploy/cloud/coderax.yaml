# This configuration is mounted at /app/coderax.yaml by compose.yaml.
# Work inference is cloud-only. The verified $0 OpenRouter models join the Work
# catalog when the server environment provides OPENROUTER_API_KEY. No local
# model server, GPU, or model download is part of this stack.
version: 1.3.17
cache: true
freeInference:
  enabled: true
