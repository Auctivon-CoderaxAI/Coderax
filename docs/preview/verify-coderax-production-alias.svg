<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Coderax deployment preflight: production alias fix</title>
<desc id="desc">Before: production alias rejected by preview-only hostname check. After: exact production alias and preview aliases accepted; spoofed, non-HTTPS, credentialed or non-origin URLs rejected.</desc>
<rect width="1200" height="530" fill="#f8fafc"/>
<text x="44" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Coderax deployment URL preflight</text>
<text x="44" y="84" font-family="Arial, sans-serif" font-size="17" fill="#475569">Issue #141 · PR #174 · scripts/verify-coderax-deployment.mjs</text>
<rect x="36" y="110" width="535" height="305" rx="16" fill="#fff" stroke="#fecaca" stroke-width="2"/>
<rect x="629" y="110" width="535" height="305" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
<text x="62" y="150" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#991b1b">BEFORE · production blocked</text>
<text x="655" y="150" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">AFTER · exact alias allowed</text>
<rect x="64" y="178" width="474" height="57" rx="8" fill="#f1f5f9"/>
<text x="80" y="202" font-family="monospace" font-size="15" fill="#0f172a">https://coderaxai.vercel.app</text>
<text x="80" y="222" font-family="Arial, sans-serif" font-size="13" fill="#475569">Valid production origin</text>
<rect x="656" y="178" width="474" height="57" rx="8" fill="#f1f5f9"/>
<text x="672" y="202" font-family="monospace" font-size="15" fill="#0f172a">https://coderaxai.vercel.app</text>
<text x="672" y="222" font-family="Arial, sans-serif" font-size="13" fill="#475569">Valid production origin</text>
<path d="M300 236 V264" stroke="#64748b" stroke-width="3"/><path d="M294 257 L300 267 L306 257" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M895 236 V264" stroke="#64748b" stroke-width="3"/><path d="M889 257 L895 267 L901 257" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="64" y="274" width="474" height="55" rx="8" fill="#fee2e2"/>
<text x="80" y="297" font-family="monospace" font-size="14" fill="#7f1d1d">startsWith("coderax-")</text>
<text x="80" y="316" font-family="Arial, sans-serif" font-size="14" fill="#7f1d1d">FALSE → preflight throws</text>
<rect x="656" y="274" width="474" height="55" rx="8" fill="#dcfce7"/>
<text x="672" y="296" font-family="monospace" font-size="13" fill="#14532d">preview pattern OR exact production alias</text>
<text x="672" y="316" font-family="Arial, sans-serif" font-size="14" fill="#14532d">TRUE → preflight proceeds</text>
<text x="64" y="367" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">Deployment check never reaches backend.</text>
<text x="656" y="357" font-family="Arial, sans-serif" font-size="15" fill="#166534">Origin validated; backend health still must pass.</text>
<text x="656" y="380" font-family="Arial, sans-serif" font-size="15" fill="#166534">No production switch or model call performed.</text>
<rect x="36" y="435" width="1128" height="64" rx="12" fill="#e2e8f0"/>
<text x="58" y="460" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Security negatives retained</text>
<text x="58" y="485" font-family="Arial, sans-serif" font-size="15" fill="#334155">Reject lookalike hosts, non-HTTPS, embedded credentials, query strings, fragments and non-origin paths.</text>
</svg>