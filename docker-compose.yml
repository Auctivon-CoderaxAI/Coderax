# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: Coderax
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      # Adds the pinned source-built Freebuff SDK at /opt/freebuff-sdk. Point
      # FREEBUFF_SDK_DIR at the trusted checkout that produced dist/index.cjs.
      target: node-freebuff
      additional_contexts:
        freebuff-sdk-src: ${FREEBUFF_SDK_DIR:-../freebuff-main/sdk}
      args:
        # Bump with the SDK checkout and the lockfile in docker/freebuff-sdk/.
        FREEBUFF_SDK_VERSION: ${FREEBUFF_SDK_VERSION:-0.10.7}
    image: coderax:local
    networks:
      - default
      - model
    # The image creates this on a fresh data volume; repeat it so an existing
    # volume also has the private Work workspace root.
    # The pinned Freebuff SDK accepts plain HTTP only on loopback, so the
    # forwarder maps 127.0.0.1:11434 onto the `ollama` service before the API
    # process starts. See docker/ollama-loopback.cjs.
    command:
      - sh
      - -c
      - |
        mkdir -p /app/data/freebuff-workspace
        node /app/docker/ollama-loopback.cjs &
        exec node api/server/index.js
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/Coderax
      - MEILI_HOST=http://meilisearch:7700
      - CODERAX_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - OLLAMA_UPSTREAM_HOST=ollama
      - OLLAMA_UPSTREAM_PORT=11434
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,ollama,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,ollama,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      # Container paths and the in-image SDK; the host's coderax.yaml keeps
      # pointing at the local checkout and is never mounted here.
      - type: bind
        source: ./coderax.docker.yaml
        target: /app/coderax.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
      - coderax-data:/app/data
  ollama:
    container_name: coderax-ollama
    image: ollama/ollama:0.40.17
    networks:
      - model
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
  ollama-init:
    # Creates the durable 16k-context variant once the model store is ready.
    # The source model is pulled on first start and reused from ollama-data.
    container_name: coderax-ollama-init
    image: ollama/ollama:0.40.17
    networks:
      - model
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # The CLI takes host:port; a scheme makes some versions dial the literal
      # value. The service is reachable by name on the Compose network.
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ollama show qwen3.5:4b-16k >/dev/null 2>&1; then
          exit 0
        fi
        if ! ollama show qwen3.5:4b >/dev/null 2>&1; then
          attempt=1
          until ollama pull qwen3.5:4b; do
            if [ "$$attempt" -ge 3 ]; then
              echo "pulling qwen3.5:4b failed after $$attempt attempts" >&2
              exit 1
            fi
            attempt=$$((attempt + 1))
            sleep 10
          done
        fi
        printf 'FROM qwen3.5:4b\nPARAMETER num_ctx 16384\n' > /tmp/Modelfile
        ollama create qwen3.5:4b-16k -f /tmp/Modelfile
    # Retry the container itself after an exhausted pull; `api` keeps waiting.
    restart: "on-failure:3"
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

networks:
  # Only the API and initializer need to reach Ollama. The Ollama server
  # still needs outbound access to pull models on a fresh volume.
  model: {}

volumes:
  pgdata2:
  coderax-data:
  ollama-data:
