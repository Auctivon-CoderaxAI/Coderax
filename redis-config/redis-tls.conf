# TLS material is resolved relative to the Redis server's working directory.
# Redis has no environment expansion, and recording an absolute path from one
# developer's machine makes this file unusable everywhere else, so
# start-redis-tls.sh changes into this directory before starting the server.
port 0
tls-port 6380
tls-cert-file certs/server-cert.pem
tls-key-file certs/server-key.pem
tls-ca-cert-file certs/ca-cert.pem
tls-auth-clients no
tls-dh-params-file certs/redis.dh
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
tls-prefer-server-ciphers yes
tls-session-caching no
tls-session-cache-size 5000
tls-session-cache-timeout 60
bind 127.0.0.1
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
