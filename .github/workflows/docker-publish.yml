name: Reusable Docker Publish

# Builds each image once per architecture on a runner of that architecture, pushes
# untagged digest-addressed manifests, then merges the digests into multi-platform
# manifest lists. Building linux/arm64 on an amd64 runner needs QEMU, which measured
# 5-6x slower than native on these images (npm ci 52.6s -> 333.2s, npm run frontend
# 90.4s -> 442.8s) and made the emulated leg ~84% of the build.
#
# Every image-publishing workflow calls this, so a fix here reaches all of them. The
# prefix-glob bug in #15446 was one artifact-name expression that would otherwise have
# needed correcting in five separate files.
#
# GHCR is the registry this repository owns, so it is always published. Docker Hub is
# optional: both Docker Hub secrets must be configured for it to publish there. Every
# build leg used to require them, so with the secrets unset each job died at
# "Login to Docker Hub" with "Username and password required" before it built anything.

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of objects with `target`, `file` and `image_name`, e.g.
          [{"target":"node","file":"Dockerfile","image_name":"lc-dev"}]
        required: true
        type: string
      tag_suffixes:
        description: >-
          Newline-separated tags applied to every image in every registry, e.g.
          "abc1234\nlatest". Blank lines are ignored.
        required: true
        type: string
      arches:
        description: JSON array of architectures to build.
        type: string
        default: '["amd64","arm64"]'
      checkout_ref:
        description: Ref to build. Defaults to the ref that triggered the caller.
        type: string
        default: ''
      build_branch:
        description: Value for the BUILD_BRANCH build-arg and runtime env.
        type: string
        default: ''
      build_timeout_minutes:
        type: number
        default: 90
    secrets:
      DOCKERHUB_USERNAME:
        description: >-
          Optional Docker Hub account. Docker Hub publishing is skipped unless both
          Docker Hub secrets are supplied; GHCR is always published.
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image.image_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
        arch: ${{ fromJSON(inputs.arches) }}

    steps:
      # Falls back to the caller's commit SHA rather than an empty ref, so every
      # build leg of a run checks out the same immutable commit even if the
      # branch advances mid-run.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      # No QEMU: the runner is already the target architecture.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare environment
        run: cp .env.example .env

      # Read from the checkout rather than github.sha, so a caller that builds a
      # specific ref (main-image-workflow) stamps that ref's commit. Registry names
      # must be lowercase, and the repository owner is not guaranteed to be.
      # image_refs is the registry list the build pushes to; Docker Hub joins it only
      # when both of its secrets exist, so an unconfigured mirror cannot fail the leg.
      - name: Compute build metadata
        id: metadata
        env:
          BUILD_BRANCH_INPUT: ${{ inputs.build_branch }}
          IMAGE_NAME: ${{ matrix.image.image_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          image_refs="$ghcr_image"
          printf 'GHCR_IMAGE=%s\n' "$ghcr_image" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_image="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            image_refs="${image_refs},${dockerhub_image}"
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials are not configured; publishing ${IMAGE_NAME} to GHCR only."
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
          fi
          printf 'image_refs=%s\n' "$image_refs" >> "$GITHUB_OUTPUT"
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'BUILD_BRANCH=%s\n' "$BUILD_BRANCH_INPUT" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.metadata.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The layer cache lives in GHCR beside the image: no 10GB Actions-cache cap,
      # and readable from every branch and workflow, unlike type=gha which is
      # branch-scoped. The ref is per-architecture so the platform jobs cannot
      # clobber each other's cache manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.image.target }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,"name=${{ steps.metadata.outputs.image_refs }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Export digest and destination fingerprint
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REFS: ${{ steps.metadata.outputs.image_refs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build did not produce a valid SHA-256 digest." >&2
            exit 1
          fi
          # Bind the digest to the exact registry references without putting any
          # secret values in the artifact.
          fingerprint=$(printf '%s' "$IMAGE_REFS" | sha256sum)
          printf '%s\n%s\n' "$BUILD_DIGEST" "${fingerprint%% *}" > /tmp/digests/publication

      # The `-arch-` separator keeps one image's artifacts out of another's glob.
      # Image names commonly prefix one another (`coderax` / `coderax-api`,
      # `lc-dev` / `lc-dev-api`), and a bare `digests-<image>-*` pattern matches
      # both, which is exactly the failure in #15446.
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.image_name }}-arch-${{ matrix.arch }}
          path: /tmp/digests/publication
          if-no-files-found: error
          retention-days: 1
          # A full re-run (retry-docker-builds uses `rerun` when a job was
          # cancelled) keeps the run id, and v4 refuses to upload over an existing
          # artifact name. Overwrite instead of qualifying the name by
          # run_attempt: `rerun-failed-jobs` re-runs the merge alone, which must
          # still find the digests the earlier attempt's build legs uploaded.
          overwrite: true

  merge:
    name: Merge manifests (${{ matrix.image.image_name }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}

    steps:
      # Registry names must be lowercase, and the repository owner is not guaranteed to be.
      # Resolve the currently configured targets so they can be checked against
      # the destinations recorded by every build leg, including on a merge retry.
      - name: Resolve image names
        id: names
        env:
          IMAGE_NAME: ${{ matrix.image.image_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          image_refs="$ghcr_image"
          printf 'GHCR_IMAGE=%s\n' "$ghcr_image" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            image_refs="${image_refs},docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
          fi
          printf 'IMAGE_REFS=%s\n' "$image_refs" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digests-${{ matrix.image.image_name }}-arch-*
          merge-multiple: false
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.names.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The digests are identical across registries (manifests are content-addressed),
      # so the same set sources every manifest list.
      - name: Create manifest lists and push
        working-directory: /tmp/digests
        env:
          EXPECTED_ARCHES: ${{ join(fromJSON(inputs.arches), ' ') }}
          DIGEST_ARTIFACT_PREFIX: digests-${{ matrix.image.image_name }}-arch-
          TAG_SUFFIXES: ${{ inputs.tag_suffixes }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          read -r -a arches <<< "$EXPECTED_ARCHES"
          artifacts=(*)
          if (( ${#arches[@]} == 0 || ${#artifacts[@]} != ${#arches[@]} )); then
            echo "Expected one artifact per architecture ($EXPECTED_ARCHES); found ${#artifacts[@]}." >&2
            exit 1
          fi
          fingerprint=$(printf '%s' "$IMAGE_REFS" | sha256sum)
          digests=()
          declare -A seen_digests=()
          for arch in "${arches[@]}"; do
            record="${DIGEST_ARTIFACT_PREFIX}${arch}/publication"
            if [[ ! -f "$record" ]]; then
              echo "Missing publication record for ${arch}; re-run all jobs to rebuild every architecture." >&2
              exit 1
            fi
            mapfile -t publication < "$record"
            if [[ "${#publication[@]}" -ne 2 || ! "${publication[0]}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid publication record for ${arch}; re-run all jobs." >&2
              exit 1
            fi
            if [[ "${publication[1]}" != "${fingerprint%% *}" ]]; then
              echo "Registry destinations changed since the ${arch} build; re-run all jobs with the current configuration." >&2
              exit 1
            fi
            digest="${publication[0]}"
            if [[ -n "${seen_digests[$digest]:-}" ]]; then
              echo "The publication record for ${arch} repeats another architecture's digest; re-run all jobs." >&2
              exit 1
            fi
            seen_digests[$digest]=1
            digests+=("$digest")
          done

          tag_args=()
          while IFS= read -r suffix; do
            [ -n "$suffix" ] || continue
            tag_args+=(-t "IMAGE:${suffix}")
          done <<< "$TAG_SUFFIXES"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No tag suffixes supplied; refusing to publish an untagged manifest." >&2
            exit 1
          fi

          IFS=, read -r -a registries <<< "$IMAGE_REFS"

          # Check every source before moving any tags. A previous push may no
          # longer be readable even when its destination still matches.
          for image in "${registries[@]}"; do
            for digest in "${digests[@]}"; do
              docker buildx imagetools inspect --raw "${image}@${digest}" > /dev/null
            done
          done

          echo "Merging ${#digests[@]} digests into $(( ${#tag_args[@]} / 2 )) tag(s) per registry: ${registries[*]}"
          for image in "${registries[@]}"; do
            docker buildx imagetools create \
              "${tag_args[@]/IMAGE:/${image}:}" \
              "${digests[@]/#/${image}@}"
          done

      - name: Inspect image
        env:
          TAG_SUFFIXES: ${{ inputs.tag_suffixes }}
        run: |
          set -euo pipefail
          first_tag=$(grep -m1 -v '^[[:space:]]*$' <<< "$TAG_SUFFIXES")
          docker buildx imagetools inspect "${GHCR_IMAGE}:${first_tag}"
