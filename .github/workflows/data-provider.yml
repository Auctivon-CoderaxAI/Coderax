name: Publish `coderax-data-provider` to NPM

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full commit SHA recorded in the release approval'
        required: true
        type: string
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual publish requested'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$APPROVED_SHA" ]]; then
            echo "::error::The dispatch commit does not match the approved release SHA."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
      - run: cd packages/data-provider && npm ci
      - run: cd packages/data-provider && npm run build
      - name: Pack package
        run: |
          mkdir -p npm-package
          cd packages/data-provider
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm-package"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: coderax-data-provider-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 2

  publish-npm:
    timeout-minutes: 15
    needs: pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish  # Must match npm trusted publisher config
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with OIDC support
        run: npm install -g npm@11.14.1 --ignore-scripts

      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: coderax-data-provider-package
          path: npm-package

      - name: Publish package
        working-directory: npm-package
        run: npm publish *.tgz
