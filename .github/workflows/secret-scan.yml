name: Secret scan

# Free replacement for GitHub secret scanning and push protection, which are
# only available on private repositories with GitHub Secret Protection (paid).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-commits:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the commits introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD"
          else
            RANGE="${BASE_SHA}..HEAD"
          fi
          echo "Scanning ${RANGE}"
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            detect --source=/repo --no-banner --redact --exit-code=1 \
            --log-opts="$RANGE"

  full-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit full history
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/gitleaks:/report" "$GITLEAKS_IMAGE" \
            detect --source=/repo --no-banner --redact --exit-code=1 \
            --report-format json --report-path=/report/gitleaks-report.json
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
