name: Coderax post-merge deployment verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Full HTTPS Coderax Vercel deployment origin; no credentials'
        required: false
        type: string

permissions:
  contents: read

# Main pushes share a group and supersede older pushes. Each manual run gets a
# unique group so a push cannot cancel an in-progress manual check.
concurrency:
  group: coderax-post-merge-deployment-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    name: Verify deployed Express API and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Nothing is deployed without the Vercel credentials, so waiting ten
      # minutes for production to serve this commit can only fail. Report the
      # gap and skip this check instead.
      - name: Check deployment secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Post-merge verification skipped::Missing repository secret(s): ${missing[*]}. See deploy/vercel/README.md; nothing was deployed to verify."
            {
              echo "### Post-merge verification skipped"
              echo ""
              echo "Missing repository secret(s): \`${missing[*]}\`."
              echo ""
              echo "See \`deploy/vercel/README.md\`. Nothing was deployed to verify."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Wait for pushed revision and verify deployment
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'push'
        env:
          # The production alias is the default; set the CODERAX_DEPLOYMENT_URL
          # repository variable to check a different Coderax Vercel origin.
          CODERAX_DEPLOYMENT_URL: ${{ vars.CODERAX_DEPLOYMENT_URL || 'https://coderaxai.vercel.app' }}
          EXPECTED_BACKEND_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.CODERAX_DEPLOYMENT_URL;
          const expected = process.env.EXPECTED_BACKEND_REVISION;
          const configUrl = new URL('/api/config', origin).toString();
          const deadline = Date.now() + 10 * 60 * 1000;
          let last = 'no response';
          while (Date.now() < deadline) {
            try {
              const response = await fetch(configUrl, {
                cache: 'no-store',
                signal: AbortSignal.timeout(15_000),
              });
              const payload = await response.json();
              last = payload?.buildInfo?.commit ?? 'missing buildInfo.commit';
              if (last === expected) {
                console.log(`Production reports ${last}`);
                break;
              }
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          if (last !== expected) {
            throw new Error(
              `production did not report ${expected} within 10 minutes (last: ${last})`,
            );
          }
          NODE
          node scripts/verify-coderax-deployment.mjs \
            --live-url "$CODERAX_DEPLOYMENT_URL" \
            --expected-backend-revision "$EXPECTED_BACKEND_REVISION"
      - name: Verify deployed Express API and UI (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          CODERAX_DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || vars.CODERAX_DEPLOYMENT_URL || 'https://coderaxai.vercel.app' }}
        run: node scripts/verify-coderax-deployment.mjs --live-url "$CODERAX_DEPLOYMENT_URL"
