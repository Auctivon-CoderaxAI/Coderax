name: Validate cloud-only deployment files

on:
  pull_request:
    paths:
      - "deploy/cloud/**"
      - "scripts/probe-cloud-model.mjs"
      - ".github/workflows/cloud-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate Node.js probe syntax
        run: node --check scripts/probe-cloud-model.mjs
      - name: Validate Docker Compose configuration without any real secrets
        run: |
          cat > .env <<'EOF'
          CODERAX_DOMAIN=example.com
          MONGO_ROOT_PASSWORD=0123456789abcdef0123456789abcdef
          MEILI_MASTER_KEY=0123456789abcdef0123456789abcdef
          EOF
          docker compose --env-file .env -f deploy/cloud/compose.yaml config --quiet
          rm .env
      - name: Validate Caddy HTTPS configuration
        run: |
          docker run --rm \
            -e CODERAX_DOMAIN=example.com \
            -v "${PWD}/deploy/cloud/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
