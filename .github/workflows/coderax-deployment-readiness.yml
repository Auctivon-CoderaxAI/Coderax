name: Coderax deployment readiness

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'worker/**'
      - 'scripts/verify-cloudflare-deployment*.mjs'
      - 'scripts/write-deployment-metadata.mjs'
      - 'scripts/deploy-cloudflare.mjs'
      - 'package.json'
      - '.github/workflows/coderax-deployment-readiness.yml'
  workflow_dispatch:
    inputs:
      production_url:
        description: 'HTTPS origin of the coderax Worker'
        required: true
        type: string

permissions:
  contents: read

# A newer push supersedes an obsolete pull-request run. Manual dispatches are
# never cancelled by a concurrent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Validate the Cloudflare build and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'

      - name: Validate committed Cloudflare configuration
        run: node scripts/verify-cloudflare-deployment.mjs --config-only

      - name: Test the edge router and release gate
        run: node --test worker/index.test.mjs scripts/verify-cloudflare-deployment.test.mjs

      - name: Verify the live Worker
        if: github.event_name == 'workflow_dispatch'
        env:
          PRODUCTION_URL: ${{ github.event.inputs.production_url }}
        run: >-
          node scripts/verify-cloudflare-deployment.mjs
          --url "$PRODUCTION_URL"
          --expected-commit "${{ github.sha }}"
