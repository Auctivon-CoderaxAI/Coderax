name: Local dev stack tests

on:
  pull_request:
    paths:
      - 'scripts/dev/**'
      - 'package.json'
      - '.github/workflows/dev-stack.yml'
  push:
    branches: [main, dev]
    paths:
      - 'scripts/dev/**'
      - 'package.json'
      - '.github/workflows/dev-stack.yml'

permissions:
  contents: read

jobs:
  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
      - run: npm run test:dev-stack
