name: Portfolio Agent Registry

on:
  pull_request:
    paths:
      - 'scripts/portfolio/**'
      - 'docs/PORTFOLIO_ORCHESTRATION.md'
      - '.github/workflows/portfolio-agent-registry.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/portfolio/**'
      - '.github/workflows/portfolio-agent-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an obsolete pull-request run. Main pushes are the
# post-merge safety net and manual dispatches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-contract:
    name: Validate repository-agent registry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check entrypoint syntax
        run: node --check scripts/portfolio/sync.mjs
      - name: Run registry security and DAG tests
        run: node --test scripts/portfolio/registry.test.mjs
      - name: Run live binding verification tests
        run: node --test scripts/portfolio/sync.test.mjs
      - name: Confirm read-only default CLI
        run: node scripts/portfolio/sync.mjs --help
