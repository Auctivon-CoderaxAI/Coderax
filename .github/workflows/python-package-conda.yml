name: Python utility

on: [push]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lint dependency
        run: python -m pip install flake8==7.3.0
      - name: Lint with flake8
        run: python -m flake8 utils/update_env.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test environment file substitution
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT

          printf 'CODERAX_CI_SAMPLE=GET_FROM_LOCAL_ENV\nPORT=3080\n' > "$scratch/input.env"
          CODERAX_CI_SAMPLE=fixture python utils/update_env.py "$scratch/input.env" "$scratch/output.env"
          printf 'CODERAX_CI_SAMPLE=fixture\nPORT=3080\n' > "$scratch/expected.env"
          diff -u "$scratch/expected.env" "$scratch/output.env"

          status=0
          env -u CODERAX_CI_SAMPLE python utils/update_env.py "$scratch/input.env" "$scratch/missing.env" || status=$?
          test "$status" -eq 1
          test ! -e "$scratch/missing.env"
