name: Coderax API proxy and free-host contracts

on:
  pull_request:
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'api/proxy.spec.js'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'api/proxy.spec.js'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check API proxy and OCI network boundaries
        run: node --test api/proxy.spec.js scripts/verify-oci-deployment.test.mjs
