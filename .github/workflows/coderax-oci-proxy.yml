name: Coderax API proxy and free-host contracts

on:
  # Manual dispatch exists so the engine container proof can run at an exact
  # branch head before a pull request exists, and so a failed contract can be
  # re-run without an empty commit.
  workflow_dispatch:
  pull_request:
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'packages/api/src/proxy.ts'
      - 'packages/api/proxy.test.mjs'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'packages/api/src/proxy.ts'
      - 'packages/api/proxy.test.mjs'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'

permissions:
  contents: read

# A newer push supersedes an obsolete pull-request run. Main pushes are the
# post-merge safety net and are never cancelled by a concurrent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the frozen workspace
        run: npm ci --no-audit --no-fund
      - name: Build the API proxy package
        run: npm run build:api
      - name: Check API proxy and OCI network boundaries
        run: node --test packages/api/proxy.test.mjs scripts/verify-oci-deployment.test.mjs

  engine-image:
    name: Build and prove the private OpenCode engine container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the engine image
        run: docker build --tag coderax-opencode:ci deploy/oci/opencode
      - name: Prove authentication, isolation and restart recovery
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          network="coderax-engine-ci"
          container="coderax-engine-ci"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_healthy() {
            local status="starting"
            local deadline=$((SECONDS + 150))
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
              [ "$status" = healthy ] && break
              [ "$status" = unhealthy ] && break
              sleep 5
            done
            printf '%s' "$status"
          }

          docker network create "$network"
          docker run --detach --name "$container" \
            --network "$network" \
            --env "OPENCODE_SERVER_PASSWORD=$password" \
            --env OPENROUTER_API_KEY=ci-not-a-real-key \
            coderax-opencode:ci

          status="$(wait_healthy)"
          docker logs "$container" || true
          if [ "$status" != healthy ]; then
            echo "::error::the engine never became healthy (last: $status)"
            exit 1
          fi

          published="$(docker port "$container" || true)"
          if [ -n "$published" ]; then
            echo "::error::the engine publishes a host port: $published"
            exit 1
          fi

          ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")"
          anonymous="$(docker run --rm --network "$network" curlimages/curl:8.11.1 \
            -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$ip:4096/global/health" || true)"
          authenticated="$(docker run --rm --network "$network" curlimages/curl:8.11.1 \
            -s -o /dev/null -w '%{http_code}' --max-time 5 -u "opencode:$password" \
            "http://$ip:4096/global/health" || true)"
          echo "anonymous=$anonymous authenticated=$authenticated"
          if [ "$anonymous" = 200 ]; then
            echo "::error::the engine answered an unauthenticated request with 200"
            exit 1
          fi
          if [ "$authenticated" != 200 ]; then
            echo "::error::the configured password did not authenticate (got $authenticated)"
            exit 1
          fi

          docker restart "$container" >/dev/null
          status="$(wait_healthy)"
          if [ "$status" != healthy ]; then
            echo "::error::the engine did not recover after a restart (last: $status)"
            exit 1
          fi

          {
            echo '### Private engine container'
            echo ''
            echo "- Image: \`deploy/oci/opencode\`, built from \`$GITHUB_SHA\`"
            echo '- Health: healthy after start and after restart'
            echo '- Published host ports: none'
            echo "- Anonymous request: \`$anonymous\` (a 200 would be a failure)"
            echo "- Authenticated request: \`$authenticated\`"
          } >> "$GITHUB_STEP_SUMMARY"
