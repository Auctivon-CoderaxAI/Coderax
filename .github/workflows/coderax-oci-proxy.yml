name: Coderax API proxy and free-host contracts

on:
  # Manual dispatch exists so the engine container proof can run at an exact
  # branch head before a pull request exists, and so a failed contract can be
  # re-run without an empty commit.
  workflow_dispatch:
  pull_request:
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'packages/api/src/proxy.ts'
      - 'packages/api/proxy.test.mjs'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'api/proxy.js'
      - 'api/proxy-handler.js'
      - 'packages/api/src/proxy.ts'
      - 'packages/api/proxy.test.mjs'
      - 'deploy/oci/**'
      - 'scripts/verify-oci-deployment.test.mjs'
      - 'vercel.json'
      - '.github/workflows/coderax-oci-proxy.yml'

permissions:
  contents: read

# A newer push supersedes an obsolete pull-request run. Main pushes are the
# post-merge safety net and are never cancelled by a concurrent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the frozen workspace
        run: npm ci --no-audit --no-fund
      - name: Build the API proxy package
        run: npm run build:api
      - name: Check API proxy and OCI network boundaries
        run: node --test packages/api/proxy.test.mjs scripts/verify-oci-deployment.test.mjs

  engine-image:
    name: Build and prove the private OpenCode engine container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the engine image
        run: docker build --tag coderax-opencode:ci deploy/oci/opencode
      - name: Prove authentication, isolation and restart recovery
        shell: bash
        run: |
          set -euo pipefail

          image='coderax-opencode:ci'
          network='coderax-engine-ci'
          container='coderax-engine-ci'
          probe_image='curlimages/curl:8.11.1'
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"

          die() {
            echo "::error::$*"
            exit 1
          }

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          dump_logs() {
            echo '::group::engine container logs'
            docker logs --tail 100 "$container" 2>&1 || true
            echo '::endgroup::'
          }

          # Liveness and readiness come from one inspect, so an exited container
          # fails immediately instead of waiting out the readiness deadline.
          container_state() {
            docker inspect --format '{{.State.Running}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null
          }

          wait_healthy() {
            local state running status deadline
            deadline=$((SECONDS + 150))
            while [ "$SECONDS" -lt "$deadline" ]; do
              state="$(container_state)" || state='false/missing'
              running="${state%%/*}"
              status="${state#*/}"
              if [ "$running" != true ]; then
                printf '%s' 'exited'
                return 1
              fi
              case "$status" in
                healthy)
                  printf '%s' healthy
                  return 0
                  ;;
                unhealthy | none)
                  printf '%s' "$status"
                  return 1
                  ;;
              esac
              sleep 5
            done
            printf '%s' 'timed-out'
            return 1
          }

          # A non-zero docker run is a failed probe, never a silent "not 200":
          # curl exits non-zero when the connection itself fails.
          http_probe() {
            docker run --rm --network "$network" "$probe_image" \
              --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 5 "$@"
          }

          password="$(openssl rand -hex 32)" || die 'could not generate the engine password'

          docker network create "$network" >/dev/null \
            || die "could not create the $network network"

          docker run --detach --name "$container" \
            --network "$network" \
            --env "OPENCODE_SERVER_PASSWORD=$password" \
            --env OPENROUTER_API_KEY=ci-not-a-real-key \
            "$image" >/dev/null \
            || { dump_logs; die 'the engine container failed to start'; }

          status="$(wait_healthy)" || true
          if [ "$status" != healthy ]; then
            dump_logs
            die "the engine never became healthy (last: $status)"
          fi

          published="$(docker port "$container")" \
            || die 'could not read the published ports of the engine'
          if [ -n "$published" ]; then
            die "the engine publishes a host port: $published"
          fi

          ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$network\"}}{{.IPAddress}}{{end}}" "$container")" \
            || die 'could not read the engine container address'
          if [[ ! "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            die "the engine has no IPv4 address on $network (got '$ip')"
          fi

          anonymous="$(http_probe "http://$ip:4096/global/health")" \
            || die 'the unauthenticated probe could not reach the engine'
          wrong_password="$(http_probe -u "opencode:wrong-$password" "http://$ip:4096/global/health")" \
            || die 'the wrong-password probe could not reach the engine'
          authenticated="$(http_probe -u "opencode:$password" "http://$ip:4096/global/health")" \
            || die 'the authenticated probe could not reach the engine'
          echo "anonymous=$anonymous wrong-password=$wrong_password authenticated=$authenticated"

          case "$anonymous" in
            401 | 403) ;;
            200) die 'the engine answered an unauthenticated request with 200' ;;
            *) die "the unauthenticated request was not cleanly rejected (got '$anonymous')" ;;
          esac
          case "$wrong_password" in
            401 | 403) ;;
            200) die 'the engine accepted an incorrect password' ;;
            *) die "an incorrect password was not cleanly rejected (got '$wrong_password')" ;;
          esac
          if [ "$authenticated" != 200 ]; then
            die "the configured password did not authenticate (got '$authenticated')"
          fi

          started_before="$(docker inspect --format '{{.State.StartedAt}}' "$container")" \
            || die 'could not read the engine start time'
          docker restart "$container" >/dev/null \
            || die 'the engine container did not restart'
          started_after="$(docker inspect --format '{{.State.StartedAt}}' "$container")" \
            || die 'could not read the engine start time after the restart'
          if [ "$started_after" = "$started_before" ]; then
            die 'the engine reported the same start time; restart recovery is unproven'
          fi

          status="$(wait_healthy)" || true
          if [ "$status" != healthy ]; then
            dump_logs
            die "the engine did not recover after a restart (last: $status)"
          fi

          {
            echo '### Private engine container'
            echo ''
            echo "- Image: \`deploy/oci/opencode\`, built from \`$sha\`"
            echo '- Health: healthy after start and after a verified restart'
            echo '- Published host ports: none'
            echo "- Anonymous request: \`$anonymous\` (401/403 required)"
            echo "- Incorrect password: \`$wrong_password\` (401/403 required)"
            echo "- Authenticated request: \`$authenticated\`"
          } >> "$summary"
