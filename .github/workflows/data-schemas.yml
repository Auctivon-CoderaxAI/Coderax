name: Publish `@coderax/data-schemas` to NPM

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full commit SHA recorded in the release approval'
        required: true
        type: string
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual publish requested'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Verify approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$APPROVED_SHA" ]]; then
            echo "::error::The dispatch commit does not match the approved release SHA."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Install dependencies
        run: cd packages/data-schemas && npm ci

      - name: Build
        run: cd packages/data-schemas && npm run build

      - name: Check version change
        id: check
        working-directory: packages/data-schemas
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @coderax/data-schemas version 2>/dev/null || echo "0.0.0")
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "No version change, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version changed, proceeding with publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack package
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/data-schemas
        run: |
          mkdir -p "$GITHUB_WORKSPACE/npm-package"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm-package"

      - name: Upload package
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coderax-data-schemas-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 2

  publish-npm:
    timeout-minutes: 15
    needs: pack
    if: github.ref == 'refs/heads/main' && needs.pack.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: publish  # Must match npm trusted publisher config
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with OIDC support
        run: npm install -g npm@11.14.1 --ignore-scripts

      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: coderax-data-schemas-package
          path: npm-package

      - name: Publish
        working-directory: npm-package
        run: npm publish *.tgz --access public
