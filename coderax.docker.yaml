# Container configuration for the image built from Dockerfile target
# `node-freebuff`. Cloud Work runs on a verified $0 hosted model with native
# tool calling; no local model download or Ollama service is required.
version: 1.3.17
freeInference:
  enabled: true

providerFallback:
  enabled: true

engines:
  workspaces:
    # Under the persisted `coderax-data` volume (compose creates them on start).
    privateRoot: /app/data/freebuff-workspace
    cloudRoot: /app/data/freebuff-cloud-workspace
  workChat:
    enabled: true
    engine: freebuff
    mode: cloud
  freebuff:
    enabled: true
    # Installed by the `freebuff-sdk` stage; never a host path.
    sdkPath: /opt/freebuff-sdk/dist/index.cjs
    # The adapter accepts only a catalogued $0 model that advertises native
    # tool calling. The credential stays in the server environment and is
    # resolved by name, never written here.
    baseURL: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    timeoutMs: 900000
    maxAgentSteps: 24
