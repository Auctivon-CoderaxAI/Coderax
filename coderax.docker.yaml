# Container configuration for the image built from Dockerfile target
# `node-freebuff`. Local development keeps using coderax.yaml, which points at
# the host checkout of the SDK; this file only ever runs inside Docker, where
# the SDK is baked into the image and the Compose `ollama` service provides the
# model.
version: 1.3.17
freeInference:
  enabled: true

providerFallback:
  enabled: true

engines:
  workspaces:
    # Under the persisted `coderax-data` volume (compose creates it on start).
    privateRoot: /app/data/freebuff-workspace
  workChat:
    enabled: true
    engine: freebuff
    mode: private
  freebuff:
    enabled: true
    # Installed by the `freebuff-sdk` stage; never a host path.
    sdkPath: /opt/freebuff-sdk/dist/index.cjs
    # Work's tool schema needs 16k of context. The Compose `ollama-init`
    # service creates the durable qwen3.5:4b-16k variant on first start with:
    #   FROM qwen3.5:4b
    #   PARAMETER num_ctx 16384
    #   ollama create qwen3.5:4b-16k -f Modelfile
    # The context lives in the model, so no OLLAMA_CONTEXT_LENGTH override is
    # needed. Loopback is implicit; Compose service names are not, so the
    # `ollama` host is allowlisted explicitly.
    baseURL: http://ollama:11434/v1
    allowedHosts:
      - ollama
    model: ollama/qwen3.5:4b-16k
    timeoutMs: 900000
    maxAgentSteps: 24
