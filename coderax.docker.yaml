# Container configuration for the image built from Dockerfile target
# `node-freebuff`. Local development keeps using coderax.yaml, which points at
# the host checkout of the SDK; this file only ever runs inside Docker, where
# the SDK is baked into the image and Ollama is reached over the host gateway.
version: 1.3.17
freeInference:
  enabled: true

providerFallback:
  enabled: true

engines:
  workspaces:
    # Under the persisted `coderax-data` volume (compose creates it on start).
    privateRoot: /app/data/freebuff-workspace
  workChat:
    enabled: true
    engine: freebuff
    mode: private
  freebuff:
    enabled: true
    # Installed by the `freebuff-sdk` stage; never a host path.
    sdkPath: /opt/freebuff-sdk/dist/index.cjs
    # Work's tool schema needs 16k of context. The host's main Ollama serves
    # the durable qwen3.5:4b-16k variant, created once with:
    #   FROM qwen3.5:4b
    #   PARAMETER num_ctx 16384
    #   ollama create qwen3.5:4b-16k -f Modelfile
    # The context lives in the model, so no OLLAMA_CONTEXT_LENGTH override or
    # second Ollama instance is needed.
    # The adapter still accepts loopback hosts only, so this needs a
    # loopback-capable route to the host before Freebuff reports ready here.
    baseURL: http://host.docker.internal:11434/v1
    model: ollama/qwen3.5:4b-16k
    timeoutMs: 900000
    maxAgentSteps: 24
